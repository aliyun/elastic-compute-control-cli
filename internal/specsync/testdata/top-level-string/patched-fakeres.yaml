schema_version: 2
product: fake
resource: fakeres
kind: regional
schema:
  fields:
    id:
      type: string
    name:
      type: string
      description: 'The name of the resource.'
bindings:
  create_fakeres:
    api: CreateFakeres
    request:
      RegionId: $context.region
      Name: $.name
      ApiParam:
        raw: $.api_param
operations:
  create:
    input:
      fields:
        - id
        - name:
            brief: false
    workflow:
      - binding: create_fakeres
