schema_version: 2
product: ack
api_product: CS
resource: config
parent: inspect
kind: regional
display_name:
  en: inspect config
  zh-CN: 巡检配置
description:
  en: Manage cluster inspection config
  zh-CN: 管理集群巡检配置
examples:
  - ecctl ack inspect config get --cluster <cluster-id>
  - ecctl ack inspect config update --cluster <cluster-id> --enabled --recurrence 'FREQ=DAILY;BYHOUR=10;BYMINUTE=15'

identity:
  field: cluster
  output_root:
    one: config
    many: configs

schema:
  fields:
    cluster:
      type: string
      description:
        en: ACK cluster ID
        zh-CN: ACK 集群 ID
    enabled:
      type: boolean
      description:
        en: enable periodic inspection
        zh-CN: 启用周期性巡检
    recurrence:
      type: string
      description:
        en: RFC5545 daily recurrence rule with BYHOUR and BYMINUTE
        zh-CN: 包含 BYHOUR 和 BYMINUTE 的 RFC5545 每日巡检规则
    disabled_check_items:
      type: string_array
      description:
        en: inspection check item names to disable
        zh-CN: 要禁用的巡检项名称

controls:
  api_param:
    type: key_value
    repeatable: true
    description:
      en: additional request parameter key=value
      zh-CN: 额外请求参数 key=value

probes:
  detail:
    api: GetClusterInspectConfig
    request:
      clusterId: $.cluster
      ApiParam:
        raw: $.api_param
    response:
      item: $
      request_id: $.requestId
      fields:
        enabled: $.enabled
        recurrence: $.recurrence
        disabled_check_items: $.disabledCheckItems

waiters:
  config_present:
    probe: detail
    target: present
    interval: 1s
    timeout: 60s

bindings:
  create_config:
    api: CreateClusterInspectConfig
    request:
      clusterId: $.cluster
      body.enabled: $.enabled
      body.recurrence: $.recurrence
      body.disabledCheckItems: $.disabled_check_items
      ApiParam:
        raw: $.api_param
    request_id_from: $.requestId
    wait: config_present
  update_config:
    api: UpdateClusterInspectConfig
    request:
      clusterId: $.cluster
      body.enabled: $.enabled
      body.recurrence: $.recurrence
      body.disabledCheckItems: $.disabled_check_items
      ApiParam:
        raw: $.api_param
    request_id_from: $.requestId
  delete_config:
    api: DeleteClusterInspectConfig
    request:
      clusterId: $.cluster
      ApiParam:
        raw: $.api_param
    request_id_from: $.requestId

operations:
  update:
    examples:
      - ecctl ack inspect config update --cluster <cluster-id>
    description:
      en: Update inspection config
      zh-CN: 更新巡检配置
    input:
      fields:
        - cluster:
            required: true
        - enabled
        - recurrence:
            required: true
        - disabled_check_items
      controls:
        - api_param
    workflow:
      - probe: detail
        as: existing
        not_found: empty
      - binding: create_config
        unless: has(context.existing)
      - binding: update_config
        when: has(context.existing)
      - probe: detail
      - emit:
          fields:
            cluster: $input.cluster
  delete:
    examples:
      - ecctl ack inspect config delete --cluster <cluster-id>
    description:
      en: Delete inspection config
      zh-CN: 删除巡检配置
    input:
      fields:
        - cluster:
            required: true
      controls:
        - api_param
    workflow:
      - binding: delete_config
      - emit:
          deleted: true
          fields:
            cluster: $input.cluster
  get:
    aliases: [show, describe]
    description:
      en: Get inspection config
      zh-CN: 查询巡检配置
    input:
      fields:
        - cluster:
            required: true
      controls:
        - api_param
    workflow:
      - probe: detail
      - emit:
          fields:
            cluster: $input.cluster
