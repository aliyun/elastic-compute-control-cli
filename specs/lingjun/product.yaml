schema_version: 1
product: lingjun
priority: 3
resources:
  - cluster
  - node
  - node-group
  - vpd
  - subnet
  - vcc
  - er
  - eni
  - lni
  - vsc
  - net-test
description:
  en: Manage Lingjun clusters, node groups, and high-performance network resources.
  zh-CN: 管理灵骏集群、节点组及高性能网络资源。
examples:
  - ecctl lingjun cluster list
  - ecctl lingjun cluster create --name train-cluster --cluster-type <type> --node-groups @node-groups.json
  - ecctl lingjun vpd create --name train-vpd --cidr 10.0.0.0/16
