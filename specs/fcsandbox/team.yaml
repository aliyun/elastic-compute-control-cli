schema_version: 2
product: fcsandbox
api_product: FCSandbox
resource: team
kind: regional
display_name: {en: team, zh-CN: 团队}
description: {en: Manage FC Agent Sandbox teams., zh-CN: 管理 FC 云沙箱团队。}
examples:
  - ecctl fcsandbox team list --region cn-hangzhou
  - ecctl fcsandbox team get <team-id> --region cn-hangzhou
  - ecctl fcsandbox team create --name dev --region cn-hangzhou

identity:
  field: id
  output_root: {one: team, many: teams}

schema:
  fields:
    id:
      type: string
      description: {en: team ID, zh-CN: 团队 ID}
    name:
      type: string
      description: {en: team name, zh-CN: 团队名称}
    description:
      type: string
      description: {en: team description, zh-CN: 团队描述}
    resource_group:
      type: string
      description: {en: resource group ID, zh-CN: 资源组 ID}
    plan:
      type: string
      description: {en: team subscription plan, zh-CN: 团队订阅计划}
    status:
      type: string
      description: {en: team status, zh-CN: 团队状态}
    created_time:
      type: string
      description: {en: team creation time, zh-CN: 团队创建时间}
    user_id:
      type: string
      description: {en: creator user ID, zh-CN: 创建者用户 ID}
    allow_update_team_name:
      type: boolean
      description: {en: whether the team name can be changed, zh-CN: 是否允许修改团队名称}
    read_only:
      type: boolean
      description: {en: whether the team is read-only, zh-CN: 团队是否只读}

controls:
  filter:
    type: key_value
    repeatable: true
    description: {en: filter expression key=value, zh-CN: 过滤表达式 key=value}
  limit:
    type: integer
    default: 50
    max: 50
    description: {en: maximum teams per page, zh-CN: 每页最多返回的团队数量}
  page:
    type: integer
    default: 1
    description: {en: results page to return, zh-CN: 返回结果页码}
  all:
    type: boolean
    description: {en: fetch all pages from page 1, zh-CN: 从第一页获取所有结果}
  no_wait:
    type: boolean
    description: {en: return after the deletion request is accepted, zh-CN: 删除请求被接受后立即返回}
  timeout:
    type: duration
    default: 300s
    description: {en: deletion wait timeout, zh-CN: 删除等待超时时间}

probes:
  detail:
    api: GetTeam
    request: {teamID: $.id}
    response:
      item: $.team
      request_id: $.requestId
      id: $.teamID
      state: $.status
      fields: &team_fields
        id: $.teamID
        name: $.teamName
        description: $.description
        resource_group: $.resourceGroupID
        plan: $.plan
        status: $.status
        created_time: $.createdTime
        user_id: $.userID
        allow_update_team_name: $.allowUpdateTeamName
        read_only: $.readOnly
  list:
    api: ListTeams
    request:
      teamName: $.name
      resourceGroupID: $.resource_group
      plan: $.plan
      pageNumber: $.page
      pageSize: $.limit
    response:
      items: $.teams
      total: $.total
      request_id: $.requestId
      id: $.teamID
      state: $.status
      fields: *team_fields

waiters:
  absent_after_delete:
    probe: detail
    target: absent
    interval: 2s
    timeout: 300s
    failure:
      states: [delete_failed]

bindings:
  create_team:
    api: CreateTeam
    request:
      body:
        teamName: $.name
        description: $.description
        resourceGroupID: $.resource_group
        plan: $.plan
    require_all: [{request: body.teamName}]
    id_from: $.team.teamID
    request_id_from: $.requestId
  update_team:
    api: UpdateTeam
    hooks:
      before: [validate_update]
      api_calls:
        - hook: validate_update
          api: GetTeam
          phase: preflight
          purpose: {en: check read-only and team rename restrictions, zh-CN: 检查只读和团队改名限制}
    request:
      teamID: $.id
      body:
        teamName: $.name
        description: $.description
        resourceGroupID: $.resource_group
        plan: $.plan
    require_all: [{request: teamID}]
    require_any:
      - {request: body.teamName}
      - {request: body.description}
      - {request: body.resourceGroupID}
      - {request: body.plan}
    request_id_from: $.requestId
  delete_team:
    api: DeleteTeam
    hooks:
      before: [validate_delete]
      api_calls:
        - hook: validate_delete
          api: GetTeam
          phase: preflight
          purpose: {en: check whether the team is read-only, zh-CN: 检查团队是否只读}
    request: {teamID: $.id}
    require_all: [{request: teamID}]
    request_id_from: $.requestId
    wait: absent_after_delete

operations:
  create:
    description: {en: Create an FC Agent Sandbox team, zh-CN: 创建 FC 云沙箱团队}
    input:
      fields:
        - name: {required: true}
        - description
        - resource_group
        - plan
    workflow:
      - binding: create_team
      - probe: detail
        ids: [$context.id]
        not_found: error
    examples: [ecctl fcsandbox team create --name dev --region cn-hangzhou]
  update:
    description: {en: Update an FC Agent Sandbox team, zh-CN: 更新 FC 云沙箱团队}
    input:
      fields:
        - id: {required: true, positional: true}
        - name
        - description
        - resource_group
        - plan
    workflow:
      - binding: update_team
      - probe: detail
        ids: [$input.id]
        not_found: error
    examples: [ecctl fcsandbox team update <team-id> --description updated]
  delete:
    description: {en: Delete an FC Agent Sandbox team, zh-CN: 删除 FC 云沙箱团队}
    input:
      fields:
        - id: {required: true, positional: true}
      controls: [no_wait, timeout]
    workflow:
      - binding: delete_team
        wait_unless: input.no_wait
      - emit:
          fields: {id: $input.id}
          deleted: true
        unless: input.no_wait
    output:
      fields:
        actions: $result.actions
        team: {id: $input.id}
        deleted: {value: $result.deleted, unless: $input.no_wait}
        deletion_requested: {value: true, when: $input.no_wait}
    examples: [ecctl fcsandbox team delete <team-id> --timeout 300s]
  get:
    aliases: [show, describe]
    description: {en: Get an FC Agent Sandbox team, zh-CN: 获取 FC 云沙箱团队}
    input:
      fields:
        - id: {required: true, positional: true}
    workflow:
      - probe: detail
        ids: [$input.id]
        not_found: error
    examples: [ecctl fcsandbox team get <team-id> --region cn-hangzhou]
  list:
    description: {en: List FC Agent Sandbox teams, zh-CN: 列出 FC 云沙箱团队}
    input:
      controls: [filter, limit, page, all]
    filters:
      name: {target: name}
      resource-group: {target: resource_group}
      plan: {target: plan}
    workflow:
      - probe: list
        many: true
    examples:
      - ecctl fcsandbox team list --filter name=dev --limit 50 --page 1
      - ecctl fcsandbox team list --all
