schema_version: 1
product: sandbox
aliases: [sbx]
priority: 7
resources:
  - sandbox
  - template
  - team
expose_default_resource: true
description:
  en: Manage E2B sandboxes and templates, and FC OpenAPI teams.
  zh-CN: 管理 E2B 沙箱及模板，以及 FC OpenAPI 团队。
examples:
  - ecctl sandbox list --filter state=running
  - ecctl sbx template create --name python --from-image python:3.12
  - ecctl sandbox team list --region cn-hangzhou
  - ecctl sbx team create --name dev --region cn-hangzhou
