resource: sandbox/quota
serial: true
timeout: 15m

steps:
  - name: create first owned Team
    run: >
      ecctl sandbox team create --name {{.team_name}}
      --description "{{.team_owner}}" --plan eco --output=json
    at: $.team
    expect:
      id: {type: string, min_len: 1}
      status: {eq: active}
    capture:
      team_id: id
      first_team_id: id
    teardown: ecctl sandbox team delete {{.team_id}} --timeout 5m

  - name: update first Quota
    run: ecctl sandbox quota update {{.team_id}} --cpu-cores 32 --memory-gb 64 --output=json
    at: $.quota
    expect:
      id: {eq: "{{.team_id}}"}
      team_id: {eq: "{{.team_id}}"}
      cpu_cores: {eq: 32}
      memory_gb: {eq: 64}
    teardown: ecctl sandbox quota delete {{.team_id}} --output=json

  - name: create second owned Team
    run: >
      ecctl sandbox team create --name {{.team_name}}
      --description "{{.team_owner}}" --plan eco --output=json
    at: $.team
    expect:
      id: {type: string, min_len: 1, ne: "{{.first_team_id}}"}
      status: {eq: active}
    capture:
      team_id: id
      second_team_id: id
    teardown: ecctl sandbox team delete {{.team_id}} --timeout 5m

  - name: update second Quota
    run: ecctl sandbox quota update {{.team_id}} --cpu-cores 32 --memory-gb 64 --output=json
    at: $.quota
    expect:
      id: {eq: "{{.team_id}}"}
      team_id: {eq: "{{.team_id}}"}
      cpu_cores: {eq: 32}
      memory_gb: {eq: 64}
    teardown: ecctl sandbox quota delete {{.team_id}} --output=json

  - name: first page
    run: ecctl sandbox quota list --limit 1 --output=json
    expect:
      $.pagination.limit: {eq: 1}
      $.pagination.returned: {eq: 1}
      $.pagination.has_more: {eq: true}
      $.pagination.next_token: {type: string, min_len: 1}
      $.quotas[0].id: {type: string, min_len: 1}
    capture:
      quota_next_token: $.pagination.next_token
      first_page_id: $.quotas[0].id

  - name: second page from captured token
    run: ecctl sandbox quota list --limit 1 --next-token {{.quota_next_token}} --output=json
    expect:
      $.pagination.limit: {eq: 1}
      $.pagination.returned: {eq: 1}
      $.quotas[0].id: {type: string, min_len: 1, ne: "{{.first_page_id}}"}
  - name: all pages contain both owned Quotas
    run: ecctl sandbox quota list --limit 1 --all --output=json
    expect:
      $.pagination.limit: {eq: 1}
      $.pagination.returned: {ge: 2}
      $.pagination.has_more: {eq: false}
      $.pagination.next_token: {exists: false}
    assert:
      - 'len($.quotas[?(@.id == "{{.first_team_id}}")]) == 1'
      - 'len($.quotas[?(@.id == "{{.second_team_id}}")]) == 1'

  - name: delete second Quota
    run: ecctl sandbox quota delete {{.team_id}} --output=json
    expect:
      $.deleted: {eq: true}

  - name: second Quota absent after delete
    run: ecctl sandbox quota get {{.team_id}} --output=json
    exit: 4
    expect:
      $.error.kind: {eq: not_found}
      $.error.code: {eq: NotFound}
      $.actions[0].action_name: {eq: DescribeQuota}
      $.actions[0].code: {type: string, min_len: 1}
      $.actions[0].request_id: {type: string, min_len: 1}

  - name: delete second owned Team
    run: ecctl sandbox team delete {{.team_id}} --timeout 5m
    expect:
      $.deleted: {eq: true}

  - name: read first Quota to restore its captured Team ID
    run: ecctl sandbox quota get {{.first_team_id}} --output=json
    at: $.quota
    expect:
      id: {eq: "{{.first_team_id}}"}
      team_id: {eq: "{{.first_team_id}}"}
    capture:
      team_id: id

  - name: delete first Quota
    run: ecctl sandbox quota delete {{.team_id}} --output=json
    expect:
      $.deleted: {eq: true}

  - name: first Quota absent after delete
    run: ecctl sandbox quota get {{.team_id}} --output=json
    exit: 4
    expect:
      $.error.kind: {eq: not_found}
      $.error.code: {eq: NotFound}
      $.actions[0].action_name: {eq: DescribeQuota}
      $.actions[0].code: {type: string, min_len: 1}
      $.actions[0].request_id: {type: string, min_len: 1}

  - name: delete first owned Team
    run: ecctl sandbox team delete {{.team_id}} --timeout 5m
    expect:
      $.deleted: {eq: true}
