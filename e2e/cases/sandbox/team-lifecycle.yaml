resource: sandbox/team
covers: [sandbox/template]
requires_prerequisites: [sandbox.template]
serial: true
timeout: 25m

steps:
  - name: create
    run: >
      ecctl sandbox team create
      --name {{.team_name}}
      --description "{{.team_owner}}"
    at: $.team
    expect:
      id: { type: string, min_len: 1 }
      name: { eq: "{{.team_name}}" }
      status: { eq: active }
      read_only: { eq: false }
    capture:
      team_id: id
    teardown: ecctl sandbox team delete {{.team_id}} --timeout 5m

  - name: get
    run: ecctl sandbox team get {{.team_id}}
    at: $.team
    expect:
      id: { eq: "{{.team_id}}" }
      status: { eq: active }

  - name: list
    run: ecctl sandbox team list --filter name={{.team_name}} --limit 1 --all
    assert:
      - len($.teams) == 1
      - $.teams[0].id == "{{.team_id}}"
      - $.pagination.has_more == false

  - name: update
    run: ecctl sandbox team update {{.team_id}} --description "ecctl E2E Team updated {{.run_id}}"
    at: $.team
    expect:
      id: { eq: "{{.team_id}}" }
      description: { eq: "ecctl E2E Team updated {{.run_id}}" }

  - name: create native template
    run: >
      ecctl sandbox template create --openapi --team-id {{.team_id}}
      --name {{.resource_prefix}}-fc-template
      --runtime-config '@{{.prerequisites.sandbox.template.runtime_config_file}}'
      --timeout 20m
    at: $.template
    expect:
      id: {type: string, min_len: 1}
      team_id: {eq: "{{.team_id}}"}
      build_status: {eq: ready}
    capture:
      native_template_id: id
    teardown: ecctl sandbox template delete {{.native_template_id}} --openapi --team-id {{.team_id}}

  - name: get native template
    run: ecctl sandbox template get {{.native_template_id}} --openapi --team-id {{.team_id}}
    at: $.template
    expect:
      id: {eq: "{{.native_template_id}}"}
      team_id: {eq: "{{.team_id}}"}
      runtime_config: {type: object}
      build_status: {eq: ready}

  - name: list native templates
    run: ecctl sandbox template list --openapi --team-id {{.team_id}} --limit 100
    assert:
      - 'len($.templates[?(@.id == "{{.native_template_id}}" && @.team_id == "{{.team_id}}")]) == 1'

  - name: update native template
    run: >
      ecctl sandbox template update {{.native_template_id}} --openapi --team-id {{.team_id}}
      --runtime-config '{"internetAccess":false}' --timeout 20m
    at: $.template
    expect:
      id: {eq: "{{.native_template_id}}"}
      team_id: {eq: "{{.team_id}}"}
      build_status: {eq: ready}
      runtime_config.internetAccess: {eq: false}

  - name: delete native template
    run: ecctl sandbox template delete {{.native_template_id}} --openapi --team-id {{.team_id}}
    expect:
      $.deleted: {eq: true}

  - name: delete
    run: ecctl sandbox team delete {{.team_id}} --timeout 5m
    expect:
      $.deleted: { eq: true }
