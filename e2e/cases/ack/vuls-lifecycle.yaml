# Complete ACK vulnerability scan lifecycle.
resource: ack/vuls
needs: [ack_shared_nodepool]
timeout: 20m
serial: true

steps:
  - name: create
    run: >
      ecctl ack vuls create
      --cluster {{.stack.ack_shared_cluster}}
      --timeout 10m
    expect:
      $.task_id: { type: string, min_len: 1 }
      $.vuls: { type: array }

  - name: list
    run: ecctl ack vuls list --cluster {{.stack.ack_shared_cluster}}
    assert:
      - len($.vuls) >= 0
