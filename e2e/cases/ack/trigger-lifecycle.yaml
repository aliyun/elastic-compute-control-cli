resource: ack/trigger
needs: [ack_shared_cluster]
serial: true

steps:
  - name: create
    run: >
      ecctl ack trigger create
      --cluster {{.stack.ack_shared_cluster}}
      --project default/{{.resource_prefix}}-trigger
      --type deployment
      --action redeploy
    at: $.trigger
    expect:
      id: { type: string, min_len: 1 }
      cluster: { eq: "{{.stack.ack_shared_cluster}}" }
      project: { eq: "default/{{.resource_prefix}}-trigger" }
    capture:
      trigger_id: id
    teardown: ecctl ack trigger delete {{.trigger_id}} --cluster {{.stack.ack_shared_cluster}}

  - name: get
    run: >
      ecctl ack trigger get {{.trigger_id}}
      --cluster {{.stack.ack_shared_cluster}}
      --namespace default
      --name {{.resource_prefix}}-trigger
      --type deployment
    at: $.trigger
    expect:
      id: { eq: "{{.trigger_id}}" }

  - name: list
    run: >
      ecctl ack trigger list
      --cluster {{.stack.ack_shared_cluster}}
      --namespace default
      --name {{.resource_prefix}}-trigger
      --type deployment
    assert:
      - len($.triggers) >= 1

  - name: delete
    run: ecctl ack trigger delete {{.trigger_id}} --cluster {{.stack.ack_shared_cluster}}
    expect:
      $.deleted: { eq: true }
