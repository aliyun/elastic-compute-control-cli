name: api-sync

# Report-only OpenAPI drift monitor and fixed-revision update batch producer.
#
# This workflow intentionally does not modify repository files, create a
# branch or pull request, or obtain cloud credentials. Mechanical adaptation
# remains an explicit maintainer action through `specdrift sync` so canonical
# resource specs, lifecycle cases, fixtures, and cleanup evidence stay under
# review.
#
# Drift is measured against pinned metadata prepared before the build, retaining
# every product's default API version. internal/openapimeta/manifest.json records
# its repository and full commit SHA; `make lint` checks that fixed snapshot
# offline, not the latest upstream content on every run.
#
# The producer prepares an upstream candidate only in an isolated runner
# directory. It never changes main's lock or baseline. One open update batch
# issue is the shared producer/consumer lock; the existing drift monitor is
# separate and cannot close a batch issue.

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "drift-baseline.json"
      - "specs/**"
      - "pkg/aliyun/**"
      - "internal/openapimeta/**"
      - "internal/openapimetaformat/**"
      - "cmd/openapimeta-sync/**"
      - "cmd/specdrift/**"
      - "internal/drift/**"
      - "internal/specsync/**"
      - ".github/workflows/api-sync.yml"

concurrency:
  group: api-sync-plan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect and report
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: report pinned OpenAPI metadata snapshot
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          pinned_sha=$(jq -er '
            select(.repository == "aliyun/aliyun-openapi-meta")
            | .revision
            | select(type == "string")
            | select(length == 40 and test("^[0-9a-f]{40}$"))
          ' internal/openapimeta/manifest.json)
          echo "pinned_sha=$pinned_sha" >> "$GITHUB_OUTPUT"

      - name: compare pinned snapshot with upstream metadata
        id: staleness
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_SHA: ${{ steps.metadata.outputs.pinned_sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '## OpenAPI metadata snapshot\n\n'
            printf -- '- embedded snapshot commit: %s\n' "$PINNED_SHA"
            printf -- '- drift detection uses this fixed snapshot, not the latest upstream content.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! upstream=$(gh api repos/aliyun/aliyun-openapi-meta/commits/master --jq .sha) \
            || [[ ! "$upstream" =~ ^[0-9a-f]{40}$ ]]; then
            echo "state=unreachable" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot obtain a valid full SHA from aliyun-openapi-meta upstream; metadata staleness unknown"
            printf -- '- upstream master: unavailable\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$upstream" = "$PINNED_SHA" ]; then
            echo "state=current" >> "$GITHUB_OUTPUT"
          else
            echo "state=stale" >> "$GITHUB_OUTPUT"
            echo "::notice::OpenAPI metadata snapshot differs from upstream (pinned ${PINNED_SHA}, upstream ${upstream}). Updating the embedded snapshot is manual; triage drift before accepting a new baseline. This notice does not fail CI."
          fi
          printf -- '- upstream master: %s\n' "$upstream" >> "$GITHUB_STEP_SUMMARY"

      - name: build specdrift
        id: specdrift
        shell: bash
        run: |
          set -euo pipefail
          make metadata-prepare
          mkdir -p bin
          go build -o bin/specdrift ./cmd/specdrift

      - name: detect drift
        id: detect
        shell: bash
        run: |
          set +e
          bin/specdrift detect \
            -spec-dir specs \
            -baseline drift-baseline.json \
            -format json \
            -check > drift.json 2> drift.err
          code=$?
          set -e
          case "$code" in
            0)
              echo "has_drift=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "has_drift=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat drift.err >&2
              exit "$code"
              ;;
          esac

      - name: build dry-run sync plan and bounded issue body
        if: steps.detect.outputs.has_drift == 'true'
        env:
          METADATA_REVISION: ${{ steps.metadata.outputs.pinned_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bin/specdrift sync \
            -drift drift.json \
            -spec-dir specs \
            -dry-run \
            -plan-out drift-plan.json > specsync.patch
          bin/specdrift render \
            -input drift.json \
            -plan drift-plan.json \
            -format markdown \
            -limit 50 > issue.md
          printf '\n- embedded metadata snapshot commit: %s (fixed snapshot, not a live upstream content probe)\n' "$METADATA_REVISION" >> issue.md
          printf -- '- workflow run: %s\n' "$RUN_URL" >> issue.md

      - name: upload complete drift evidence
        if: always() && steps.detect.outputs.has_drift == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-sync-drift-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            drift.json
            drift.err
            drift-plan.json
            specsync.patch

      - name: upsert drift monitor issue
        if: always() && steps.detect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DRIFT: ${{ steps.detect.outputs.has_drift }}
          METADATA_REVISION: ${{ steps.metadata.outputs.pinned_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="OpenAPI drift monitor"
          marker="<!-- ecctl-openapi-drift -->"
          issues=$(gh issue list \
            --state all \
            --search '"OpenAPI drift monitor" in:title' \
            --limit 20 \
            --json number,title,state,body)
          number=$(jq -r \
            --arg title "$title" \
            --arg marker "$marker" \
            '[.[] | select(.title == $title and ((.body // "") | contains($marker)))] | sort_by(.number) | last | .number // empty' \
            <<< "$issues")
          state=$(jq -r \
            --argjson number "${number:-0}" \
            '[.[] | select(.number == $number)] | first | .state // empty' \
            <<< "$issues")

          if [ "$HAS_DRIFT" = "true" ]; then
            if ! grep -qF "$marker" issue.md 2>/dev/null; then
              {
                printf '%s\n\n' "$marker"
                printf '# OpenAPI drift monitor\n\n'
                printf 'Drift detection succeeded, but dry-run planning or bounded rendering failed.\n\n'
                printf -- '- embedded metadata snapshot commit: %s (fixed snapshot, not a live upstream content probe)\n' "$METADATA_REVISION"
                printf -- '- workflow run: %s\n' "$RUN_URL"
                printf '\nDownload the workflow artifact for the complete drift.json and available diagnostics.\n'
              } > issue.md
            fi
            cat issue.md >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file issue.md
            else
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number"
              fi
              gh issue edit "$number" --title "$title" --body-file issue.md
            fi
          elif [ -n "$number" ] && [ "$state" = "OPEN" ]; then
            gh issue comment "$number" \
              --body "Resolved against embedded aliyun-openapi-meta snapshot ${METADATA_REVISION} (fixed snapshot, not a live upstream content probe) in run ${RUN_URL}."
            gh issue close "$number" --reason completed
          else
            echo "No OpenAPI drift against the embedded snapshot and no open monitor issue." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: prepare fixed upstream candidate in an isolated directory
        if: always() && steps.staleness.outputs.state == 'stale' && steps.specdrift.outcome == 'success'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.staleness.outputs.upstream }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          candidate_dir="${RUNNER_TEMP}/ecctl-metadata-candidate-${GITHUB_RUN_ID}"
          archive="${RUNNER_TEMP}/aliyun-openapi-meta-${CANDIDATE_SHA}.tar.gz"
          mkdir -m 700 "$candidate_dir"
          umask 077
          gh api "repos/aliyun/aliyun-openapi-meta/tarball/${CANDIDATE_SHA}" > "$archive"
          go run ./cmd/openapimeta-sync \
            -archive "$archive" -revision "$CANDIDATE_SHA" -out "$candidate_dir"
          jq -e --arg revision "$CANDIDATE_SHA" \
            '.repository == "aliyun/aliyun-openapi-meta" and .revision == $revision' \
            "$candidate_dir/manifest.json" >/dev/null
          echo "dir=$candidate_dir" >> "$GITHUB_OUTPUT"

      - name: compare referenced API semantics against the candidate
        if: always() && steps.candidate.outcome == 'success'
        id: compare
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        shell: bash
        run: |
          set +e
          bin/specdrift compare \
            -base-dir internal/openapimeta \
            -candidate-dir "$CANDIDATE_DIR" \
            -spec-dir specs \
            -format json > metadata-diff.json 2> metadata-diff.err
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) cat metadata-diff.err >&2; exit "$code" ;;
          esac
          jq -e \
            --arg base "${{ steps.metadata.outputs.pinned_sha }}" \
            --arg candidate "${{ steps.staleness.outputs.upstream }}" \
            '.repository == "aliyun/aliyun-openapi-meta" and .base_revision == $base and .candidate_revision == $candidate' \
            metadata-diff.json >/dev/null

      - name: upload complete candidate comparison evidence
        if: always() && steps.compare.outcome == 'success'
        id: candidate_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-sync-candidate-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            metadata-diff.json
            metadata-diff.err

      - name: create one fixed metadata update batch issue
        if: always() && steps.compare.outputs.has_changes == 'true' && steps.candidate_artifact.outcome == 'success'
        id: metadata-batch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.metadata.outputs.pinned_sha }}
          CANDIDATE_SHA: ${{ steps.staleness.outputs.upstream }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          key=$(jq -er '.batch_key | select(type == "string" and test("^[0-9a-f]{64}$"))' metadata-diff.json)
          marker="<!-- ecctl-openapi-update:${key} -->"
          title="OpenAPI metadata update ${CANDIDATE_SHA:0:12}"
          issues=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
          existing=$(jq -sr --arg marker "$marker" \
            '[.[][] | select(has("pull_request") | not) | select(.user.login == "github-actions[bot]") | select((.body // "") | contains($marker))] | sort_by(.number) | first | .number // empty' \
            <<< "$issues")
          active=$(jq -sr \
            '[.[][] | select(has("pull_request") | not) | select(.state == "open" and .user.login == "github-actions[bot]") | select((.body // "") | test("<!-- ecctl-openapi-update:[0-9a-f]{64} -->"))] | sort_by(.number) | first | .number // empty' \
            <<< "$issues")
          main_revision=$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/internal/openapimeta/manifest.json?ref=main" \
            --header 'Accept: application/vnd.github.raw+json' \
            --jq 'select(.repository == "aliyun/aliyun-openapi-meta") | .revision')
          [[ "$main_revision" =~ ^[0-9a-f]{40}$ ]] || exit 2
          if [ "$main_revision" != "$BASE_SHA" ]; then
            echo "Skipped stale metadata batch: main metadata changed from ${BASE_SHA} to ${main_revision}; a fresh producer run must compare the current base." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -n "$existing" ]; then
            existing_state=$(jq -sr --argjson number "$existing" \
              '[.[][] | select(.number == $number)] | first | .state // empty' <<< "$issues")
            if [ "$existing_state" = "closed" ]; then
              if [ -n "$active" ] && [ "$active" != "$existing" ]; then
                echo "Metadata batch #${active} remains open; closed matching batch #${existing} waits for the shared lock." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              gh issue reopen "$existing"
              echo "Reopened metadata batch issue #${existing} for unresolved key ${key}." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Existing metadata batch issue #${existing} has key ${key}." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ -n "$active" ]; then
            echo "Metadata batch #${active} remains open; candidate ${CANDIDATE_SHA} waits for the shared batch lock." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            printf '%s\n\n# OpenAPI metadata update batch\n\n' "$marker"
            printf -- '- repository: %s\n' "$GITHUB_REPOSITORY"
            printf -- '- base revision: %s\n' "$BASE_SHA"
            printf -- '- candidate revision: %s\n' "$CANDIDATE_SHA"
            printf -- '- batch key: %s\n' "$key"
            printf -- '- producer workflow run: %s\n' "$RUN_URL"
            printf '\nThis is a fixed upstream candidate. The producer did not modify main, the metadata lock, resource specs or drift baseline. Download the complete comparison artifact from the run. If it expires, rebuild from the exact candidate revision and verify the report before work.\n\n'
            printf '## Affected resource/API scope (first 50 changes)\n\n'
            jq -r '.changes[:50][] | "- \(.product)/\(.resource) \(.binding) \(.api): \(.path) [\(.compatibility)]"' metadata-diff.json
            printf '\nAll related resources must be adapted and validated before accepting the new baseline. Breaking and unknown items need explicit analysis.\n'
          } > metadata-update-issue.md
          if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file metadata-update-issue.md; then
            issues=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100")
            recovered=$(jq -sr --arg marker "$marker" \
              '[.[][] | select(has("pull_request") | not) | select(.user.login == "github-actions[bot]") | select((.body // "") | contains($marker))] | sort_by(.number) | first | .number // empty' \
              <<< "$issues")
            if [ -z "$recovered" ]; then
              echo "Issue creation result is unknown; no retry in this run." >&2
              exit 1
            fi
            echo "Recovered metadata batch issue #${recovered} after an uncertain create response." >> "$GITHUB_STEP_SUMMARY"
          fi
